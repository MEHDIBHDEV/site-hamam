<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Gommage au savon noir avec gant kessa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0E10"/>
      <stop offset="1" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A86FF"/>
      <stop offset="1" stop-color="#6BA892"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Savon noir pot -->
  <g transform="translate(360,420)">
    <rect x="-40" y="-60" width="260" height="130" rx="16" fill="#0C0E12" stroke="#23262B"/>
    <rect x="-20" y="-92" width="220" height="40" rx="10" fill="#0C0E12" stroke="#23262B"/>
    <rect x="-20" y="-92" width="220" height="40" rx="10" fill="url(#acc)" opacity="0.10"/>
  </g>
  <!-- Gant kessa -->
  <g transform="translate(720,420)">
    <path d="M-80 -40c0-60 50-110 110-110s110 50 110 110v120c0 22-18 40-40 40h-140c-22 0-40-18-40-40z" fill="#0C0E12" stroke="#23262B"/>
    <rect x="-100" y="80" width="220" height="24" rx="12" fill="#3A86FF" opacity="0.8"/>
    <g opacity="0.25" stroke="url(#acc)" stroke-width="6">
      <path d="M-10 -50 v220"/>
      <path d="M40 -50 v220"/>
      <path d="M90 -40 v200"/>
    </g>
  </g>
  <!-- Reflet/halo -->
  <circle cx="600" cy="350" r="220" fill="url(#acc)" opacity="0.08"/>
</svg>
