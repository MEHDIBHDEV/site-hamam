<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>Logo Hammam Benkachour</title>
  <desc>Emblème circulaire avec arche et vapeur stylisée, bleu luxueux et eucalyptus.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A86FF"/>
      <stop offset="1" stop-color="#6BA892"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Badge -->
  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="220" fill="#111317"/>
    <circle cx="256" cy="256" r="220" fill="none" stroke="url(#accent)" stroke-width="14"/>
  </g>
  <!-- Arche hammam -->
  <path d="M156 360 V240 c0-55 45-100 100-100s100 45 100 100v120" fill="none" stroke="#3A86FF" stroke-width="16" stroke-linecap="round"/>
  <path d="M196 360 V252 c0-33 27-60 60-60s60 27 60 60v108" fill="none" stroke="#6BA892" stroke-width="12" stroke-linecap="round"/>
  <!-- Vapeur -->
  <path d="M210 210c-10-10-10-26 0-36 8-8 8-20 0-28" fill="none" stroke="#3A86FF" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 202c-10-10-10-26 0-36 8-8 8-20 0-28" fill="none" stroke="#6BA892" stroke-width="8" stroke-linecap="round"/>
  <path d="M302 210c-10-10-10-26 0-36 8-8 8-20 0-28" fill="none" stroke="#3A86FF" stroke-width="8" stroke-linecap="round"/>
  <!-- Base sol -->
  <path d="M136 360 H376" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <!-- Wordmark (optionnel dans l’asset) -->
  <g aria-hidden="true">
    <text x="256" y="430" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="34" fill="#F5F5F5" letter-spacing="1.2">Hammam Benkachour</text>
    <text x="256" y="456" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#C9CDD2">Oujda</text>
  </g>
</svg>
